name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional TestFlight release notes
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Sign and upload to TestFlight
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate signing credentials
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository secret or variable before running this workflow."
              exit 1
            fi
          done

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: mn.amtai.foodorder
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Select provisioning profile
        id: profile
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
        run: |
          set -euo pipefail
          profile_name="$(jq -er '[.[] | select(.type == "IOS_APP_STORE")] | first | .name // empty' <<<"$PROFILES")" \
            || { echo "::error::No active App Store provisioning profile exists for mn.amtai.foodorder."; exit 1; }
          echo "name=$profile_name" >> "$GITHUB_OUTPUT"

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "provisioningProfiles": {
                  "mn.amtai.foodorder": os.environ["PROFILE_NAME"],
              },
          }
          with open("ExportOptions.plist", "wb") as export_options:
              plistlib.dump(options, export_options)
          PY

      - name: Archive and export signed IPA
        id: build
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: FoodOrderApp.xcodeproj
          scheme: FoodOrderApp
          configuration: Release
          sdk: iphoneos
          action: archive
          archive-path: ${{ runner.temp }}/FoodOrderApp.xcarchive
          export-options-plist: ExportOptions.plist
          export-path: ${{ runner.temp }}/TestFlightExport
          build-number: ${{ github.run_number }}
          build-settings: |
            DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }}
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=Apple Distribution
            PROVISIONING_PROFILE_SPECIFIER=${{ steps.profile.outputs.name }}

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.build.outputs.ipa-path }}
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: "false"

      - name: Save signed IPA as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodOrderApp-iphone-signed
          path: ${{ steps.build.outputs.ipa-path }}
          if-no-files-found: error
